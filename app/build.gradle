plugins {
    id 'com.android.application'
}

android {
    namespace 'com.expensetracker.upi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.expensetracker.upi'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            // CI (GitHub Actions) supplies these via env vars sourced from repo Secrets.
            // The hardcoded values are only a fallback so local builds keep working
            // unchanged; don't rely on them once this repo has any real distribution.
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'release.keystore.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'changeit123'
            keyAlias System.getenv('KEY_ALIAS') ?: 'upiexpensetracker'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'changeit123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}
