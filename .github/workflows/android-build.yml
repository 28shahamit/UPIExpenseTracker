name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is checked into this repo, so this sets up a pinned
      # Gradle version directly (also gives free build caching between runs).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Always build the unsigned debug APK - useful for quick testing on a
      # device and doesn't need any secrets configured.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UPIExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Signed release build only runs once the KEYSTORE_BASE64 secret exists,
      # so forks/PRs without access to secrets still build successfully above.
      - name: Check for release signing secret
        id: has_keystore
        run: echo "present=${{ secrets.KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: steps.has_keystore.outputs.present == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore.jks

      - name: Build release APK
        if: steps.has_keystore.outputs.present == 'true'
        env:
          KEYSTORE_FILE: release.keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        if: steps.has_keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: UPIExpenseTracker-release-apk
          path: app/build/outputs/apk/release/*.apk
