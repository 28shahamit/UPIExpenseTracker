name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is checked into this repo, so this sets up a pinned
      # Gradle version directly (also gives free build caching between runs).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Stable debug signing key, stored only as a GitHub Actions secret (never committed).
      # Without it each run's fresh VM generates a new random debug key, so every APK has a
      # different signature and can't be installed over the previous one (forcing an uninstall
      # and losing app data). Fails loudly on push/manual runs rather than silently producing
      # a throwaway-signed APK; PRs (which may not have secret access) only get a warning.
      - name: Decode stable debug keystore
        id: debugkey
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug-signing.jks
            echo "file=debug-signing.jks" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret unavailable - debug APK will use a throwaway key."
          else
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is missing - builds would get a different signing key every run and could not be installed over each other. Add the DEBUG_* secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_FILE: ${{ steps.debugkey.outputs.file }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UPIExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Signed release build only runs once the KEYSTORE_BASE64 secret exists,
      # so forks/PRs without access to secrets still build successfully above.
      - name: Check for release signing secret
        id: has_keystore
        run: echo "present=${{ secrets.KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: steps.has_keystore.outputs.present == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore.jks

      - name: Build release APK
        if: steps.has_keystore.outputs.present == 'true'
        env:
          KEYSTORE_FILE: release.keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        if: steps.has_keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: UPIExpenseTracker-release-apk
          path: app/build/outputs/apk/release/*.apk
